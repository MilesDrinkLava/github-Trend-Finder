[package]
name = "gh-finder"
version = "1.0.0"
description = "用中文搜 GitHub 开源项目"
edition = "2021"

[lib]
name = "gh_finder_lib"
# 桌面版只需要 rlib；staticlib/cdylib 是 Tauri 移动端用的，
# 在 Windows GNU 工具链下 cdylib 会因导出符号过多导致链接失败。
crate-type = ["rlib"]
# 桌面窗口入口没有独立的单元测试宿主；纯核心回归在 tests/core.rs。
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "system-proxy"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync"] }
open = "5"
